<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Preview | Cognitive Canines</title>
</head>
<body>
<p>Opening the portal preview... <a id="go" href="dashboard.html">Tap here if nothing happens.</a></p>
<script>
var id = new URLSearchParams(location.search).get('id');
var dest = id ? 'dashboard.html?preview=' + encodeURIComponent(id) : 'admin-dashboard.html';
document.getElementById('go').href = dest;
location.replace(dest);
</script>
</body>
</html>
