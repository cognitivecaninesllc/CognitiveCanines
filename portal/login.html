<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Login | Cognitive Canines</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --ink:#e8e4dc;--ink2:#c5bfb4;--muted:#8a8278;
  --accent:#3d5c3e;--accent2:#5a7d4a;
  --gold:#d4824a;--gold2:#e8a96a;--gold-light:#2a1f12;
  --surface:#1a1c19;--white:#222520;--border:#333830;
  --serif:'Instrument Serif',Georgia,serif;
  --sans:'DM Sans',system-ui,sans-serif;
}
body{font-family:var(--sans);color:var(--ink);background:var(--surface);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
.card{background:var(--white);border:0.5px solid var(--border);padding:2.5rem;max-width:420px;width:100%;border-radius:8px;box-shadow:0 8px 40px rgba(0,0,0,0.35)}
.logo{text-align:center;margin-bottom:2rem}
.logo .mark{width:64px;height:64px;border-radius:50%;overflow:hidden;border:2px solid var(--gold);margin:0 auto 1rem}
.logo .mark img{width:100%;height:100%;object-fit:cover;object-position:center 20%}
.logo h1{font-family:var(--serif);font-size:1.6rem;font-weight:400}
.logo p{font-size:11px;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);margin-top:0.3rem}
.form-group{margin-bottom:1.2rem}
.form-group label{display:block;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);margin-bottom:0.4rem}
.form-group input{width:100%;padding:0.75rem 1rem;border:0.5px solid var(--border);background:var(--surface);font-family:var(--sans);font-size:0.9rem;color:var(--ink);outline:none;border-radius:4px;transition:border-color 0.2s}
.form-group input:focus{border-color:var(--gold)}
.btn{width:100%;background:var(--gold);color:#1a1c19;padding:0.85rem;border:none;cursor:pointer;font-family:var(--sans);font-size:12px;font-weight:500;letter-spacing:0.09em;text-transform:uppercase;border-radius:4px;margin-top:0.5rem;transition:background 0.2s}
.btn:hover{background:var(--gold2)}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.msg{font-size:0.82rem;padding:0.7rem 1rem;border-radius:4px;margin-bottom:1rem;display:none}
.msg.error{background:#3a2020;color:#e8a8a8;display:block}
.msg.success{background:#1e3320;color:#a8e8b8}
.link-row{text-align:center;margin-top:1.5rem;font-size:0.82rem;color:var(--muted)}
.link-row a{color:var(--gold);text-decoration:none}
.back-link{display:inline-block;margin-bottom:1.5rem;font-size:12px;color:var(--muted);text-decoration:none;letter-spacing:0.05em}
.back-link:hover{color:var(--gold)}
</style>
</head>
<body>
<div class="card">
  <a href="../index.html" class="back-link">&larr; Back to site</a>
  <div class="logo">
    <div class="mark"><img src="https://i.imgur.com/Lnrlh9e.jpg" alt="Silas" style="object-position:center 30%"></div>
    <h1>Welcome back</h1>
    <p>Log in to your portal</p>
  </div>
  <div id="msg" class="msg"></div>
  <form id="loginForm">
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" required>
    </div>
    <div class="form-group">
      <label>Password</label>
      <input type="password" id="password" required>
    </div>
    <button type="submit" class="btn" id="loginBtn">Log In</button>
  </form>
  <div class="link-row">
    First time logging in? <a href="set-password.html">Set your password</a>
  </div>
</div>

<script>
const supabaseClient = supabase.createClient('https://mjgruhbmenjzjcrrwnyl.supabase.co', 'sb_publishable_bJS9kA9KG1TT6L_o00TGxw_CB1_GQWa');

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const msg = document.getElementById('msg');
  msg.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Logging in...';

  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

  if (error) {
    msg.textContent = error.message;
    msg.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Log In';
    return;
  }

  window.location.href = 'dashboard.html';
});
</script>
</body>
</html>
