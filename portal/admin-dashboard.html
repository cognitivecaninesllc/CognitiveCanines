<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard | Cognitive Canines</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --ink:#e8e4dc;--ink2:#c5bfb4;--muted:#8a8278;
  --accent:#3d5c3e;--accent2:#5a7d4a;
  --gold:#d4824a;--gold2:#e8a96a;--gold-light:#2a1f12;
  --surface:#1a1c19;--white:#222520;--border:#333830;
  --serif:'Instrument Serif',Georgia,serif;
  --sans:'DM Sans',system-ui,sans-serif;
}
body{font-family:var(--sans);color:var(--ink);background:var(--surface);min-height:100vh}
.card{background:var(--white);border:0.5px solid var(--border);padding:2.5rem;max-width:420px;width:100%;border-radius:8px;box-shadow:0 8px 40px rgba(0,0,0,0.35);margin:auto}
.center-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:2rem}
.logo{text-align:center;margin-bottom:2rem}
.logo .mark{width:64px;height:64px;border-radius:50%;overflow:hidden;border:2px solid var(--gold);margin:0 auto 1rem}
.logo .mark img{width:100%;height:100%;object-fit:cover;object-position:center 20%}
.logo h1{font-family:var(--serif);font-size:1.6rem;font-weight:400}
.logo p{font-size:11px;letter-spacing:0.15em;text-transform:uppercase;color:var(--muted);margin-top:0.3rem}
.form-group{margin-bottom:1.2rem}
.form-group label{display:block;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);margin-bottom:0.4rem}
.form-group input,.form-group select{width:100%;padding:0.75rem 1rem;border:0.5px solid var(--border);background:var(--surface);font-family:var(--sans);font-size:0.9rem;color:var(--ink);outline:none;border-radius:4px;transition:border-color 0.2s}
.form-group input:focus,.form-group select:focus{border-color:var(--gold)}
.btn{background:var(--gold);color:#1a1c19;padding:0.75rem 1.4rem;border:none;cursor:pointer;font-family:var(--sans);font-size:12px;font-weight:500;letter-spacing:0.09em;text-transform:uppercase;border-radius:4px;transition:background 0.2s}
.btn:hover{background:var(--gold2)}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.btn-full{width:100%;margin-top:0.5rem}
.btn-secondary{background:transparent;border:0.5px solid var(--border);color:var(--ink2)}
.btn-secondary:hover{border-color:var(--gold);color:var(--gold);background:transparent}
.btn-sm{padding:0.4rem 0.8rem;font-size:10px}
.msg{font-size:0.82rem;padding:0.7rem 1rem;border-radius:4px;margin-bottom:1rem;display:none}
.msg.error{background:#3a2020;color:#e8a8a8}
.msg.success{background:#1e3320;color:#a8e8b8}
.back-link{display:inline-block;margin-bottom:1.5rem;font-size:12px;color:var(--muted);text-decoration:none;letter-spacing:0.05em}
.back-link:hover{color:var(--gold)}

.dash-nav{background:var(--white);border-bottom:0.5px solid var(--border);padding:1rem 1.5rem;display:flex;justify-content:space-between;align-items:center}
.dash-nav-brand{display:flex;align-items:center;gap:10px}
.dash-nav-brand .mark{width:28px;height:28px;border-radius:50%;overflow:hidden;border:1.5px solid var(--gold)}
.dash-nav-brand .mark img{width:100%;height:100%;object-fit:cover;object-position:center 20%}
.dash-nav h2{font-family:var(--serif);font-size:1.1rem;font-weight:400}
.logout-btn{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);background:none;border:0.5px solid var(--border);padding:0.4rem 0.9rem;border-radius:4px;cursor:pointer;transition:all 0.2s}
.logout-btn:hover{color:var(--gold);border-color:var(--gold)}
.dash-content{max-width:800px;margin:0 auto;padding:2rem 1.5rem}
.dash-section{background:var(--white);border:0.5px solid var(--border);border-radius:8px;padding:1.5rem;margin-bottom:1.5rem}
.dash-section h3{font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--gold);margin-bottom:1rem}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
.section-head h3{margin-bottom:0}
.client-row{display:flex;justify-content:space-between;align-items:center;padding:0.9rem 0;border-bottom:0.5px solid var(--border)}
.client-row:last-child{border-bottom:none}
.client-name{font-weight:500;font-size:0.9rem}
.client-meta{font-size:0.78rem;color:var(--muted);margin-top:2px}
.client-actions{display:flex;gap:0.5rem}
.empty-state{font-size:0.85rem;color:var(--muted);font-style:italic;padding:1rem 0}
.temp-pass-box{background:var(--surface);border:0.5px solid var(--gold);border-radius:4px;padding:1rem;margin-top:1rem;font-size:0.85rem}
.temp-pass-box strong{color:var(--gold2)}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:flex;align-items:center;justify-content:center;z-index:100;padding:1rem}
.modal-box{background:var(--white);border:0.5px solid var(--border);border-radius:8px;padding:2rem;max-width:440px;width:100%;max-height:85vh;overflow-y:auto}
.modal-box h3{font-family:var(--serif);font-size:1.3rem;font-weight:400;margin-bottom:1.2rem}
.badge{display:inline-block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;padding:.25rem .6rem;border-radius:3px;font-weight:500;white-space:nowrap}
.badge-gold{background:#3a2a14;color:#e8a96a}
.badge-red{background:#3a2020;color:#e8a8a8}
.badge-green{background:#1e3320;color:#a8e8b8}
.intake-item{border-bottom:.5px solid var(--border)}
.intake-item:last-child{border-bottom:none}
.intake-item summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:.8rem;padding:.9rem 0;flex-wrap:wrap}
.intake-item summary::-webkit-details-marker{display:none}
.badges{display:flex;gap:.4rem;flex-wrap:wrap}
.intake-detail{padding:0 0 1rem}
.info-row{display:flex;justify-content:space-between;gap:1rem;padding:.6rem 0;border-bottom:.5px solid var(--border);font-size:.88rem}
.info-row:last-child{border-bottom:none}
.info-row span:first-child{color:var(--muted)}
@media(max-width:600px){.client-row{flex-direction:column;align-items:flex-start;gap:.7rem}}
</style>
</head>
<body>
<div class="dash-nav">
  <div class="dash-nav-brand">
    <div class="mark"><img src="https://i.imgur.com/Lnrlh9e.jpg" alt="Silas" style="object-position:center 30%"></div>
    <h2>Admin Dashboard</h2>
  </div>
  <button class="logout-btn" onclick="logout()">Log Out</button>
</div>

<div class="dash-content">

  <div class="dash-section">
    <div class="section-head">
      <h3>All Clients</h3>
      <button class="btn btn-sm" onclick="openAddClientModal()">+ Add Client</button>
    </div>
    <div id="clientsList"><p class="empty-state">Loading...</p></div>
  </div>

  <div class="dash-section">
    <div class="section-head">
      <h3>Resources</h3>
      <button class="btn btn-sm" onclick="openResourceModal()">+ Upload Resource</button>
    </div>
    <p class="client-meta" style="margin:-0.4rem 0 0.8rem">Upload a file once. Every client at or above the tier you choose sees it in their portal automatically.</p>
    <div id="resourcesAdminList"><p class="empty-state">Loading...</p></div>
    <input type="file" id="replaceInput" accept=".pdf,.png,.jpg,.jpeg,application/pdf,image/png,image/jpeg" style="display:none">
  </div>

  <div class="dash-section">
    <div class="section-head"><h3>Intake Quiz Submissions</h3></div>
    <div id="intakeList"><p class="empty-state">Loading...</p></div>
  </div>

</div>

<div id="addClientModal" class="modal-overlay" style="display:none">
  <div class="modal-box">
    <h3>Add a new client</h3>
    <div id="addMsg" class="msg"></div>
    <div id="tempPassResult" style="display:none"></div>
    <form id="addClientForm">
      <div class="form-group"><label>Full Name</label><input type="text" id="newName" required></div>
      <div class="form-group"><label>Email</label><input type="email" id="newEmail" required></div>
      <div class="form-group"><label>Dog's Name</label><input type="text" id="newDog"></div>
      <div class="form-group"><label>Breed</label><input type="text" id="newBreed"></div>
      <div class="form-group"><label>Dog's Age</label><input type="text" id="newAge" placeholder="e.g. 3 years, 8 months"></div>
      <div class="form-group">
        <label>Dog's Sex</label>
        <select id="newSex">
          <option value="">Not selected</option>
          <option>Male</option>
          <option>Female</option>
        </select>
      </div>
      <div class="form-group">
        <label>Spayed / Neutered</label>
        <select id="newFixed">
          <option value="">Not selected</option>
          <option>Yes</option>
          <option>No (intact)</option>
        </select>
      </div>
      <div class="form-group">
        <label>Program Tier</label>
        <select id="newTier">
          <option value="">Not selected</option>
          <option>Bronze</option>
          <option>Silver</option>
          <option>Gold</option>
          <option>Platinum</option>
          <option>Celestial</option>
        </select>
      </div>
      <div style="display:flex;gap:0.6rem;margin-top:1rem">
        <button type="submit" class="btn" id="addClientBtn">Create Client</button>
        <button type="button" class="btn btn-secondary" onclick="closeAddClientModal()">Cancel</button>
      </div>
    </form>
  </div>
</div>

<div id="resourceModal" class="modal-overlay" style="display:none">
  <div class="modal-box">
    <h3 id="resModalTitle">Upload a resource</h3>
    <div id="resMsg" class="msg"></div>
    <form id="resourceForm">
      <div class="form-group"><label>Title</label><input type="text" id="resTitle" maxlength="150" required placeholder="Canine Behavior Scale"></div>
      <div class="form-group"><label>Short description (optional)</label><input type="text" id="resDesc" maxlength="500" placeholder="How to rate and track your dog's behavior"></div>
      <div class="form-group">
        <label>Who can see it</label>
        <select id="resTier">
          <option value="Bronze">Bronze and above (everyone)</option>
          <option value="Silver">Silver and above</option>
          <option value="Gold" selected>Gold and above</option>
          <option value="Platinum">Platinum and above</option>
          <option value="Celestial">Celestial only</option>
        </select>
      </div>
      <div class="form-group" id="resFileGroup"><label>File (PDF, PNG or JPG, up to 20 MB)</label><input type="file" id="resFile" accept=".pdf,.png,.jpg,.jpeg,application/pdf,image/png,image/jpeg"></div>
      <div style="display:flex;gap:0.6rem;margin-top:1rem">
        <button type="submit" class="btn" id="resSaveBtn">Upload</button>
        <button type="button" class="btn btn-secondary" onclick="closeResourceModal()">Cancel</button>
      </div>
    </form>
  </div>
</div>

<script>
const supabaseClient = supabase.createClient('https://mjgruhbmenjzjcrrwnyl.supabase.co', 'sb_publishable_bJS9kA9KG1TT6L_o00TGxw_CB1_GQWa');
const EDGE_FUNCTION_URL = 'https://mjgruhbmenjzjcrrwnyl.supabase.co/functions/v1/create-client';

async function checkAdmin() {
  const { data: { user } } = await supabaseClient.auth.getUser();
  if (!user) { window.location.href = 'admin-login.html'; return null; }
  const { data: adminCheck } = await supabaseClient.from('admins').select('id').eq('auth_id', user.id).single();
  if (!adminCheck) { window.location.href = 'admin-login.html'; return null; }
  return user;
}

function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}

async function loadIntakeList(clients) {
  const list = document.getElementById('intakeList');
  const { data, error } = await supabaseClient.from('intake_results').select('*').order('created_at', { ascending: false }).limit(50);
  if (error) { list.innerHTML = '<p class="empty-state">Could not load quiz submissions.</p>'; return; }
  if (!data || !data.length) { list.innerHTML = '<p class="empty-state">No quiz submissions yet.</p>'; return; }
  INTAKES = data;
  const have = new Set((clients || []).map(c => String(c.email || '').toLowerCase()));
  list.innerHTML = data.map(r => {
    const a = r.answers || {};
    const sport = (a.sport === 'Curious' || a.sport === 'Training or competing');
    const consult = r.recommended_tier === 'Consultation first';
    const concerns = Array.isArray(a.concerns) ? a.concerns.join(', ') : '';
    const detail = [['Age', a.age], ['Goal', a.goal], ['Behaviors', concerns], ['Seriousness', a.severity], ['Sport interest', a.sport], ['Support wanted', a.support], ['A \u201cgood dog\u201d to you', a.good_dog], ['Location', a.location], ['Breed', a.breed], ['Sex', a.sex], ['Spayed / Neutered', a.fixed], ['Goals and notes', a.goals]]
      .filter(x => x[1]).map(x => `<div class="info-row"><span>${esc(x[0])}</span><span style="text-align:right;max-width:60%;overflow-wrap:anywhere">${esc(x[1])}</span></div>`).join('');
    return `<details class="intake-item">
      <summary>
        <div>
          <div class="client-name">${esc(r.full_name)} &middot; ${esc(r.dog_name || 'No dog listed')}</div>
          <div class="client-meta">${esc(r.email)} &middot; ${new Date(r.created_at).toLocaleDateString()} &middot; ${esc(r.recommended_tier || '')}</div>
        </div>
        <div class="badges">
          ${sport ? '<span class="badge badge-gold">Sport upsell</span>' : ''}
          ${consult ? '<span class="badge badge-red">Consult first</span>' : ''}
          ${have.has(String(r.email).toLowerCase()) ? '<span class="badge badge-green">Has account</span>' : ''}
        </div>
      </summary>
      <div class="intake-detail">${detail}
        <div style="display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.8rem">
          ${have.has(String(r.email).toLowerCase()) ? '' : `<button class="btn btn-sm" onclick="addFromIntake('${esc(r.id)}')">Add as client</button>`}
          <button class="btn btn-sm btn-secondary" onclick="deleteIntake('${esc(r.id)}')">Delete submission</button>
        </div>
      </div>
    </details>`;
  }).join('');
}

async function deleteIntake(id) {
  if (!confirm('Delete this quiz submission? This cannot be undone.')) return;
  await supabaseClient.from('intake_results').delete().eq('id', id);
  loadClients();
}


// ---------------- RESOURCES ----------------
const MAX_BYTES = 20 * 1024 * 1024;
const OK_TYPES = ['application/pdf', 'image/png', 'image/jpeg'];
let RES = [];
let editingId = null;

function tierLabel(t) { return t === 'Celestial' ? 'Celestial only' : t + ' and above'; }
function safeName(n) { return String(n || 'file').replace(/[^A-Za-z0-9._-]+/g, '_').slice(-80); }
function checkFile(f) {
  if (!f) return 'Please choose a file.';
  if (OK_TYPES.indexOf(f.type) === -1) return 'Only PDF, PNG or JPG files are allowed.';
  if (f.size > MAX_BYTES) return 'That file is over 20 MB. Please make it smaller.';
  return null;
}
function resMsg(text, ok) {
  const m = document.getElementById('resMsg');
  m.textContent = text; m.className = 'msg ' + (ok ? 'success' : 'error'); m.style.display = text ? 'block' : 'none';
}

async function loadResources() {
  const list = document.getElementById('resourcesAdminList');
  const { data, error } = await supabaseClient.from('resources').select('*').order('title');
  if (error) { list.innerHTML = '<p class="empty-state">Could not load resources. Run update_2.sql in Supabase first.</p>'; return; }
  RES = data || [];
  if (!RES.length) { list.innerHTML = '<p class="empty-state">No resources yet. Click Upload Resource to add your first one.</p>'; return; }
  list.innerHTML = RES.map(r => `
    <div class="client-row" style="align-items:flex-start;flex-wrap:wrap;gap:0.6rem">
      <div style="min-width:0;flex:1 1 220px">
        <div class="client-name">${esc(r.title)}</div>
        <div class="client-meta">${esc(r.file_name || '')} &middot; Updated ${new Date(r.updated_at || r.created_at).toLocaleDateString()}</div>
        <div style="margin-top:0.4rem"><span class="badge badge-green">${esc(tierLabel(r.min_tier))}</span></div>
      </div>
      <div class="client-actions" style="flex-wrap:wrap">
        <button class="btn btn-sm btn-secondary" onclick="viewResource('${esc(r.id)}')">View</button>
        <button class="btn btn-sm btn-secondary" onclick="startReplace('${esc(r.id)}')">Replace file</button>
        <button class="btn btn-sm btn-secondary" onclick="openResourceModal('${esc(r.id)}')">Edit</button>
        <button class="btn btn-sm btn-secondary" onclick="deleteResource('${esc(r.id)}')">Delete</button>
      </div>
    </div>`).join('');
}

function openResourceModal(id) {
  editingId = id || null;
  resMsg('');
  document.getElementById('resourceForm').reset();
  const r = id ? RES.find(x => x.id === id) : null;
  document.getElementById('resModalTitle').textContent = r ? 'Edit resource' : 'Upload a resource';
  document.getElementById('resSaveBtn').textContent = r ? 'Save changes' : 'Upload';
  document.getElementById('resFileGroup').style.display = r ? 'none' : 'block';
  if (r) {
    document.getElementById('resTitle').value = r.title;
    document.getElementById('resDesc').value = r.description || '';
    document.getElementById('resTier').value = r.min_tier;
  }
  document.getElementById('resourceModal').style.display = 'flex';
}
function closeResourceModal() { document.getElementById('resourceModal').style.display = 'none'; }

document.getElementById('resourceForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('resSaveBtn');
  const title = document.getElementById('resTitle').value.trim();
  const description = document.getElementById('resDesc').value.trim() || null;
  const min_tier = document.getElementById('resTier').value;
  if (!title) { resMsg('Please enter a title.'); return; }
  btn.disabled = true;
  try {
    if (editingId) {
      const { error } = await supabaseClient.from('resources').update({ title, description, min_tier, updated_at: new Date().toISOString() }).eq('id', editingId);
      if (error) throw error;
    } else {
      const f = document.getElementById('resFile').files[0];
      const bad = checkFile(f);
      if (bad) { resMsg(bad); btn.disabled = false; return; }
      btn.textContent = 'Uploading...';
      const path = crypto.randomUUID() + '-' + safeName(f.name);
      const up = await supabaseClient.storage.from('resources').upload(path, f, { contentType: f.type, upsert: false });
      if (up.error) throw up.error;
      const ins = await supabaseClient.from('resources').insert({ title, description, min_tier, file_path: path, file_name: f.name });
      if (ins.error) { await supabaseClient.storage.from('resources').remove([path]); throw ins.error; }
    }
    closeResourceModal();
    await loadResources();
  } catch (err) {
    resMsg('Could not save: ' + (err.message || 'unknown error'));
  }
  btn.disabled = false;
  btn.textContent = editingId ? 'Save changes' : 'Upload';
});

async function viewResource(id) {
  const r = RES.find(x => x.id === id); if (!r) return;
  const w = window.open('', '_blank');
  const { data, error } = await supabaseClient.storage.from('resources').createSignedUrl(r.file_path, 300);
  if (error || !data) { if (w) w.close(); alert('Could not open that file.'); return; }
  if (w) w.location.href = data.signedUrl; else window.location.href = data.signedUrl;
}

function startReplace(id) {
  const input = document.getElementById('replaceInput');
  input.value = '';
  input.onchange = async () => {
    const f = input.files[0]; if (!f) return;
    const bad = checkFile(f); if (bad) { alert(bad); return; }
    const r = RES.find(x => x.id === id); if (!r) return;
    const oldPath = r.file_path;
    if (!confirm('Replace "' + r.title + '" with ' + f.name + '? Clients will see the new file right away.')) return;
    const path = crypto.randomUUID() + '-' + safeName(f.name);
    const up = await supabaseClient.storage.from('resources').upload(path, f, { contentType: f.type, upsert: false });
    if (up.error) { alert('Upload failed: ' + up.error.message); return; }
    const upd = await supabaseClient.from('resources').update({ file_path: path, file_name: f.name, updated_at: new Date().toISOString() }).eq('id', id);
    if (upd.error) { await supabaseClient.storage.from('resources').remove([path]); alert('Could not update: ' + upd.error.message); return; }
    await supabaseClient.storage.from('resources').remove([oldPath]);
    loadResources();
  };
  input.click();
}

async function deleteResource(id) {
  const r = RES.find(x => x.id === id); if (!r) return;
  if (!confirm('Delete "' + r.title + '"? Clients will no longer see it. This cannot be undone.')) return;
  const del = await supabaseClient.from('resources').delete().eq('id', id);
  if (del.error) { alert('Could not delete: ' + del.error.message); return; }
  await supabaseClient.storage.from('resources').remove([r.file_path]);
  loadResources();
}

// ---------------- ADD CLIENT FROM A QUIZ SUBMISSION ----------------
let INTAKES = [];
function addFromIntake(id) {
  const r = INTAKES.find(x => x.id === id); if (!r) return;
  const a = r.answers || {};
  openAddClientModal();
  document.getElementById('newName').value = r.full_name || '';
  document.getElementById('newEmail').value = r.email || '';
  document.getElementById('newDog').value = r.dog_name || '';
  document.getElementById('newBreed').value = a.breed || '';
  document.getElementById('newSex').value = a.sex || '';
  document.getElementById('newFixed').value = a.fixed || '';
  const t = r.recommended_tier;
  document.getElementById('newTier').value = (['Bronze','Silver','Gold','Platinum','Celestial'].indexOf(t) > -1) ? t : '';
}

async function loadClients() {
  const { data: clients, error } = await supabaseClient
    .from('clients')
    .select('*, trainers(full_name)')
    .order('created_at', { ascending: false });

  const list = document.getElementById('clientsList');
  loadIntakeList(clients);
  if (!clients || clients.length === 0) {
    list.innerHTML = '<p class="empty-state">No clients yet. Click Add Client to create your first one.</p>';
    return;
  }

  list.innerHTML = clients.map(c => `
    <div class="client-row">
      <div>
        <div class="client-name">${esc(c.full_name)}</div>
        <div class="client-meta">${esc(c.email)} &middot; ${esc(c.dog_name || 'No dog listed')} &middot; ${esc(c.program_tier || 'No tier')}</div>
      </div>
      <div class="client-actions">
        <a href="admin-client.html?id=${c.id}" class="btn btn-sm btn-secondary" style="text-decoration:none;display:inline-block">Manage</a>
      </div>
    </div>
  `).join('');
}

function openAddClientModal() {
  document.getElementById('addClientModal').style.display = 'flex';
  document.getElementById('tempPassResult').style.display = 'none';
  document.getElementById('addClientForm').style.display = 'block';
}
function closeAddClientModal() {
  document.getElementById('addClientModal').style.display = 'none';
  document.getElementById('addClientForm').reset();
}

document.getElementById('addClientForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('addClientBtn');
  const msg = document.getElementById('addMsg');
  msg.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Creating...';

  const { data: { session } } = await supabaseClient.auth.getSession();

  // Automatically assign the trainer - since there's currently one trainer (you), grab it automatically
  const { data: defaultTrainer } = await supabaseClient.from('trainers').select('id').limit(1).single();

  const payload = {
    full_name: document.getElementById('newName').value,
    email: document.getElementById('newEmail').value,
    dog_name: document.getElementById('newDog').value,
    breed: document.getElementById('newBreed').value,
    dog_age: document.getElementById('newAge').value,
    dog_sex: document.getElementById('newSex').value,
    dog_fixed: document.getElementById('newFixed').value,
    program_tier: document.getElementById('newTier').value,
    trainer_id: defaultTrainer ? defaultTrainer.id : null,
  };

  try {
    const res = await fetch(EDGE_FUNCTION_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + session.access_token,
      },
      body: JSON.stringify(payload),
    });
    const result = await res.json();

    if (!res.ok) {
      msg.textContent = result.error || 'Something went wrong.';
      msg.className = 'msg error'; msg.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Create Client';
      return;
    }

    document.getElementById('addClientForm').style.display = 'none';
    const resultBox = document.getElementById('tempPassResult');
    resultBox.style.display = 'block';
    resultBox.innerHTML = `
      <div class="msg success" style="display:block">Client created successfully.</div>
      <div class="temp-pass-box">
        Share these with your client so they can log in:<br><br>
        <strong>Email:</strong> ${result.email}<br>
        <strong>Temporary Password:</strong> ${result.tempPassword}<br><br>
        They will set their own password on first login.
      </div>
      <button class="btn btn-full" style="margin-top:1rem" onclick="closeAddClientModal(); loadClients();">Done</button>
    `;
    btn.disabled = false;
    btn.textContent = 'Create Client';

  } catch (err) {
    msg.textContent = 'Network error. Please try again.';
    msg.className = 'msg error'; msg.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Create Client';
  }
});

async function logout() {
  await supabaseClient.auth.signOut();
  window.location.href = 'admin-login.html';
}

(async () => {
  const user = await checkAdmin();
  if (user) { loadClients(); loadResources(); }
})();
</script>
