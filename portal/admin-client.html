<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Client | Cognitive Canines</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --ink:#e8e4dc;--ink2:#c5bfb4;--muted:#8a8278;
  --accent:#3d5c3e;--accent2:#5a7d4a;
  --gold:#d4824a;--gold2:#e8a96a;--gold-light:#2a1f12;
  --surface:#1a1c19;--white:#222520;--border:#333830;
  --serif:'Instrument Serif',Georgia,serif;
  --sans:'DM Sans',system-ui,sans-serif;
}
body{font-family:var(--sans);color:var(--ink);background:var(--surface);min-height:100vh}
.form-group{margin-bottom:1.2rem}
.form-group label{display:block;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);margin-bottom:0.4rem}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:0.75rem 1rem;border:0.5px solid var(--border);background:var(--surface);font-family:var(--sans);font-size:0.9rem;color:var(--ink);outline:none;border-radius:4px}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--gold)}
.btn{background:var(--gold);color:#1a1c19;padding:0.75rem 1.4rem;border:none;cursor:pointer;font-family:var(--sans);font-size:12px;font-weight:500;letter-spacing:0.09em;text-transform:uppercase;border-radius:4px}
.btn:hover{background:var(--gold2)}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.btn-full{width:100%;margin-top:0.5rem}
.btn-secondary{background:transparent;border:0.5px solid var(--border);color:var(--ink2)}
.btn-secondary:hover{border-color:var(--gold);color:var(--gold);background:transparent}
.btn-sm{padding:0.4rem 0.8rem;font-size:10px}
.btn-danger{background:transparent;border:0.5px solid #7a3030;color:#e8a8a8}
.btn-danger:hover{background:#3a2020}
.msg{font-size:0.82rem;padding:0.7rem 1rem;border-radius:4px;margin-bottom:1rem;display:none}
.msg.error{background:#3a2020;color:#e8a8a8}
.msg.success{background:#1e3320;color:#a8e8b8}
.back-link{display:inline-block;margin-bottom:1.5rem;font-size:12px;color:var(--muted);text-decoration:none;letter-spacing:0.05em}
.back-link:hover{color:var(--gold)}

.dash-nav{background:var(--white);border-bottom:0.5px solid var(--border);padding:1rem 1.5rem;display:flex;justify-content:space-between;align-items:center}
.dash-nav-brand{display:flex;align-items:center;gap:10px}
.dash-nav-brand .mark{width:28px;height:28px;border-radius:50%;overflow:hidden;border:1.5px solid var(--gold)}
.dash-nav-brand .mark img{width:100%;height:100%;object-fit:cover;object-position:center 30%}
.dash-nav h2{font-family:var(--serif);font-size:1.1rem;font-weight:400}
.logout-btn{font-size:11px;letter-spacing:0.08em;text-transform:uppercase;color:var(--muted);background:none;border:0.5px solid var(--border);padding:0.4rem 0.9rem;border-radius:4px;cursor:pointer}
.logout-btn:hover{color:var(--gold);border-color:var(--gold)}
.dash-content{max-width:700px;margin:0 auto;padding:2rem 1.5rem}
.dash-section{background:var(--white);border:0.5px solid var(--border);border-radius:8px;padding:1.5rem;margin-bottom:1.5rem}
.dash-section h3{font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--gold);margin-bottom:1rem}
.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
.section-head h3{margin-bottom:0}
.client-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:0.5rem}
.client-header h1{font-family:var(--serif);font-size:1.8rem;font-weight:400}
.client-header .meta{font-size:0.85rem;color:var(--muted);margin-top:0.3rem}
.doc-item,.rec-item{display:flex;justify-content:space-between;align-items:center;padding:0.8rem 0;border-bottom:0.5px solid var(--border)}
.doc-item:last-child,.rec-item:last-child{border-bottom:none}
.doc-item a,.rec-item a{color:var(--gold2);text-decoration:none;font-size:0.9rem;font-weight:500}
.doc-item a:hover,.rec-item a:hover{color:var(--gold)}
.item-date{font-size:0.75rem;color:var(--muted);margin-top:2px}
.empty-state{font-size:0.85rem;color:var(--muted);font-style:italic;padding:1rem 0}
.view-as-btn{display:inline-block;background:var(--accent);color:#fff;padding:0.6rem 1.2rem;border-radius:4px;text-decoration:none;font-size:12px;letter-spacing:0.06em;text-transform:uppercase;margin-top:0.5rem}
.view-as-btn:hover{background:var(--accent2)}
</style>
</head>
<body>
<div class="dash-nav">
  <div class="dash-nav-brand">
    <div class="mark"><img src="https://i.imgur.com/Lnrlh9e.jpg" alt="Silas"></div>
    <h2>Manage Client</h2>
  </div>
  <button class="logout-btn" onclick="logout()">Log Out</button>
</div>

<div class="dash-content">
  <a href="admin-dashboard.html" class="back-link">&larr; Back to all clients</a>

  <div class="dash-section">
    <div class="client-header">
      <div>
        <h1 id="clientName">Loading...</h1>
        <div class="meta" id="clientMeta"></div>
      </div>
    </div>
    <a id="viewAsBtn" href="#" class="view-as-btn" target="_blank">View portal as this client &rarr;</a>
  </div>

  <div class="dash-section">
    <div class="section-head">
      <h3>Documents</h3>
      <button class="btn btn-sm" onclick="toggleDocForm()">+ Add Document</button>
    </div>
    <div id="docForm" style="display:none;margin-bottom:1rem">
      <div class="form-group"><label>Document Title</label><input type="text" id="docTitle" placeholder="Training Plan Week 1"></div>
      <div class="form-group"><label>Document Link</label><input type="text" id="docUrl" placeholder="https://drive.google.com/..."></div>
      <button class="btn btn-sm" onclick="addDocument()">Save Document</button>
    </div>
    <div id="documentsList"><p class="empty-state">Loading...</p></div>
  </div>

  <div class="dash-section">
    <div class="section-head">
      <h3>Session Recordings</h3>
      <button class="btn btn-sm" onclick="toggleRecForm()">+ Add Recording</button>
    </div>
    <div id="recForm" style="display:none;margin-bottom:1rem">
      <div class="form-group"><label>Session Title</label><input type="text" id="recTitle" placeholder="Session 3 - Leash Work"></div>
      <div class="form-group"><label>Zoom Recording Link</label><input type="text" id="recUrl" placeholder="https://zoom.us/rec/..."></div>
      <div class="form-group"><label>Session Date</label><input type="date" id="recDate"></div>
      <div class="form-group"><label>Notes (optional)</label><textarea id="recNotes" rows="2"></textarea></div>
      <button class="btn btn-sm" onclick="addRecording()">Save Recording</button>
    </div>
    <div id="recordingsList"><p class="empty-state">Loading...</p></div>
  </div>
</div>

<script>
const supabaseClient = supabase.createClient('https://mjgruhbmenjzjcrrwnyl.supabase.co', 'sb_publishable_bJS9kA9KG1TT6L_o00TGxw_CB1_GQWa');
const urlParams = new URLSearchParams(window.location.search);
const clientId = urlParams.get('id');

async function checkAdmin() {
  const { data: { user } } = await supabaseClient.auth.getUser();
  if (!user) { window.location.href = 'admin-login.html'; return null; }
  const { data: adminCheck } = await supabaseClient.from('admins').select('id').eq('auth_id', user.id).single();
  if (!adminCheck) { window.location.href = 'admin-login.html'; return null; }
  return user;
}

async function loadClient() {
  if (!clientId) { document.getElementById('clientName').textContent = 'No client selected'; return; }

  const { data: client } = await supabaseClient.from('clients').select('*').eq('id', clientId).single();
  if (!client) { document.getElementById('clientName').textContent = 'Client not found'; return; }

  document.getElementById('clientName').textContent = client.full_name;
  document.getElementById('clientMeta').textContent = `${client.email} · ${client.dog_name || 'No dog listed'} · ${client.program_tier || 'No tier'}`;
  document.getElementById('viewAsBtn').href = `admin-preview.html?id=${clientId}`;

  loadDocuments();
  loadRecordings();
}

function toggleDocForm() {
  const f = document.getElementById('docForm');
  f.style.display = f.style.display === 'none' ? 'block' : 'none';
}
function toggleRecForm() {
  const f = document.getElementById('recForm');
  f.style.display = f.style.display === 'none' ? 'block' : 'none';
}

async function loadDocuments() {
  const { data: docs } = await supabaseClient.from('documents').select('*').eq('client_id', clientId).order('created_at', { ascending: false });
  const list = document.getElementById('documentsList');
  if (!docs || docs.length === 0) { list.innerHTML = '<p class="empty-state">No documents yet.</p>'; return; }
  list.innerHTML = docs.map(d => `
    <div class="doc-item">
      <div><a href="${d.file_url}" target="_blank">${d.title}</a><div class="item-date">${new Date(d.created_at).toLocaleDateString()}</div></div>
      <button class="btn btn-sm btn-danger" onclick="deleteDocument('${d.id}')">Remove</button>
    </div>
  `).join('');
}

async function addDocument() {
  const title = document.getElementById('docTitle').value;
  const url = document.getElementById('docUrl').value;
  if (!title || !url) return;
  await supabaseClient.from('documents').insert({ client_id: clientId, title, file_url: url });
  document.getElementById('docTitle').value = '';
  document.getElementById('docUrl').value = '';
  toggleDocForm();
  loadDocuments();
}

async function deleteDocument(id) {
  await supabaseClient.from('documents').delete().eq('id', id);
  loadDocuments();
}

async function loadRecordings() {
  const { data: recs } = await supabaseClient.from('recordings').select('*').eq('client_id', clientId).order('session_date', { ascending: false });
  const list = document.getElementById('recordingsList');
  if (!recs || recs.length === 0) { list.innerHTML = '<p class="empty-state">No recordings yet.</p>'; return; }
  list.innerHTML = recs.map(r => `
    <div class="rec-item">
      <div><a href="${r.zoom_link}" target="_blank">${r.title}</a><div class="item-date">${r.session_date ? new Date(r.session_date).toLocaleDateString() : ''}${r.notes ? ' · ' + r.notes : ''}</div></div>
      <button class="btn btn-sm btn-danger" onclick="deleteRecording('${r.id}')">Remove</button>
    </div>
  `).join('');
}

async function addRecording() {
  const title = document.getElementById('recTitle').value;
  const url = document.getElementById('recUrl').value;
  const date = document.getElementById('recDate').value;
  const notes = document.getElementById('recNotes').value;
  if (!title || !url) return;
  await supabaseClient.from('recordings').insert({ client_id: clientId, title, zoom_link: url, session_date: date || null, notes: notes || null });
  document.getElementById('recTitle').value = '';
  document.getElementById('recUrl').value = '';
  document.getElementById('recDate').value = '';
  document.getElementById('recNotes').value = '';
  toggleRecForm();
  loadRecordings();
}

async function deleteRecording(id) {
  await supabaseClient.from('recordings').delete().eq('id', id);
  loadRecordings();
}

async function logout() {
  await supabaseClient.auth.signOut();
  window.location.href = 'admin-login.html';
}

(async () => {
  const user = await checkAdmin();
  if (user) loadClient();
})();
</script>
</body>
</html>
